apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mernapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Krithik49/mern-exercise-tracker-mongodb
    targetRevision: master
    path: helm/mern-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true