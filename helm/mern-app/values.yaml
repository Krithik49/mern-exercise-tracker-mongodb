frontend:
  image:
    repository: mernprojectacr.azurecr.io/mern-frontend
    tag: "latest"
  replicaCount: 2
  port: 3000
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

backend:
  image:
    repository: mernprojectacr.azurecr.io/mern-backend
    tag: "latest"
  replicaCount: 2
  port: 5000
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

mongodb:
  image: mongo
  tag: "6.0"
  port: 27017